<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="15" fill="#2563eb"/>
  <!-- D and J share the exact same straight vertical line from (27, 13) to (27, 49) -->
  <!-- The D bowl spans the entire vertical length from y=13 to y=49 -->
  <!-- The J hook curves left from the exact bottom of that same line -->
  <path d="M 27 13 
           H 38 
           C 54 13, 54 49, 38 49 
           H 27 
           M 27 13 
           V 49 
           C 19 49, 11 46, 11 36" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
